<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --ground:#F4F7F6;
    --surface:#FFFFFF;
    --surface-sunk:#EDF2F0;
    --ink:#0E1917;
    --ink-soft:#54655F;
    --ink-faint:#7E8D87;
    --accent:#0B6B5A;
    --accent-soft:#E2EFEB;
    --rule:#DBE4E1;
    --rule-strong:#C3D0CC;
    --sev-block:#9C3B2E;
    --sev-slow:#A66E12;
    --sev-crawl:#3D6B8A;
    --sev-block-bg:#F7E8E5;
    --sev-slow-bg:#F8EFDC;
    --sev-crawl-bg:#E6EEF4;
    --shadow:0 1px 2px rgba(14,25,23,.05), 0 8px 24px -18px rgba(14,25,23,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0C1413;
      --surface:#131E1C;
      --surface-sunk:#0F1817;
      --ink:#EAF1EE;
      --ink-soft:#9BADA7;
      --ink-faint:#77877F;
      --accent:#4DBFA5;
      --accent-soft:#17332C;
      --rule:#22322E;
      --rule-strong:#2E413C;
      --sev-block:#E08A78;
      --sev-slow:#DDB25C;
      --sev-crawl:#84B2D0;
      --sev-block-bg:#2A1815;
      --sev-slow-bg:#2A2113;
      --sev-crawl-bg:#131F27;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0C1413;
    --surface:#131E1C;
    --surface-sunk:#0F1817;
    --ink:#EAF1EE;
    --ink-soft:#9BADA7;
    --ink-faint:#77877F;
    --accent:#4DBFA5;
    --accent-soft:#17332C;
    --rule:#22322E;
    --rule-strong:#2E413C;
    --sev-block:#E08A78;
    --sev-slow:#DDB25C;
    --sev-crawl:#84B2D0;
    --sev-block-bg:#2A1815;
    --sev-slow-bg:#2A2113;
    --sev-crawl-bg:#131F27;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:"Newsreader",Georgia,"Times New Roman",serif;
    font-size:17px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,44px) 96px}

  /* ---------- en-tête ---------- */
  header.masthead{
    padding:clamp(40px,7vw,84px) 0 34px;
    border-bottom:1px solid var(--rule-strong);
    display:flex;flex-direction:column;gap:22px;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin:0;
  }
  h1{
    font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
    font-weight:700;font-size:clamp(2.1rem,5.2vw,3.5rem);
    line-height:1.04;letter-spacing:-.025em;margin:0;text-wrap:balance;
  }
  .standfirst{
    margin:0;max-width:64ch;font-size:1.11rem;color:var(--ink-soft);
  }
  .standfirst strong{color:var(--ink);font-weight:500}

  /* ---------- bandeau de chiffres ---------- */
  .figures{
    display:grid;gap:1px;background:var(--rule);
    grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
    border:1px solid var(--rule);border-radius:3px;overflow:hidden;
    margin:34px 0 0;
  }
  .figure{background:var(--surface);padding:16px 18px 18px;display:flex;flex-direction:column;gap:3px}
  .figure dt{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);
  }
  .figure dd{
    margin:0;font-family:"Archivo",sans-serif;font-weight:600;
    font-size:1.72rem;line-height:1.1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  .figure dd span{font-size:.94rem;font-weight:500;color:var(--ink-soft);letter-spacing:0}

  /* ---------- sections ---------- */
  section{margin-top:clamp(48px,7vw,76px)}
  h2{
    font-family:"Archivo",sans-serif;font-weight:600;
    font-size:clamp(1.32rem,2.6vw,1.72rem);letter-spacing:-.015em;
    margin:0 0 6px;text-wrap:balance;
  }
  .section-note{margin:0 0 26px;color:var(--ink-soft);max-width:66ch;font-size:1.02rem}

  /* ---------- avertissement ---------- */
  .caveat{
    background:var(--sev-slow-bg);
    border:1px solid var(--rule);border-left:3px solid var(--sev-slow);
    border-radius:3px;padding:20px 22px;margin-top:30px;
    display:flex;flex-direction:column;gap:10px;
  }
  .caveat-ok{background:var(--accent-soft);border-left-color:var(--accent)}
  .caveat-ok h3{color:var(--accent)}
  .caveat h3{
    font-family:"Archivo",sans-serif;font-size:.94rem;font-weight:600;
    letter-spacing:.01em;margin:0;color:var(--sev-slow);
  }
  .caveat p{margin:0;font-size:1rem;color:var(--ink);max-width:74ch}
  .caveat ul{margin:0;padding-left:20px;font-size:1rem}
  .caveat li{margin-bottom:5px}

  /* ---------- tickets ---------- */
  .tickets{display:flex;flex-direction:column;gap:16px}
  article.ticket{
    background:var(--surface);border:1px solid var(--rule);border-radius:3px;
    box-shadow:var(--shadow);display:grid;
    grid-template-columns:52px minmax(0,1fr);
  }
  .ticket-rail{
    border-right:1px solid var(--rule);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:20px 0;
  }
  .ticket-num{
    font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;
    color:var(--ink-faint);font-variant-numeric:tabular-nums;
  }
  .ticket-bar{width:3px;flex:1;border-radius:2px;min-height:28px}
  .sev-block .ticket-bar{background:var(--sev-block)}
  .sev-slow  .ticket-bar{background:var(--sev-slow)}
  .sev-crawl .ticket-bar{background:var(--sev-crawl)}

  .ticket-body{padding:20px 24px 22px;min-width:0}
  .ticket-head{
    display:flex;flex-wrap:wrap;align-items:baseline;
    gap:8px 14px;margin-bottom:12px;
  }
  .ticket-head h3{
    font-family:"Archivo",sans-serif;font-weight:600;font-size:1.16rem;
    letter-spacing:-.012em;margin:0;flex:1 1 320px;line-height:1.28;
  }
  .chip{
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.09em;text-transform:uppercase;
    padding:3px 8px;border-radius:2px;white-space:nowrap;
    border:1px solid transparent;
  }
  .sev-block .chip-sev{background:var(--sev-block-bg);color:var(--sev-block);border-color:var(--sev-block)}
  .sev-slow  .chip-sev{background:var(--sev-slow-bg);color:var(--sev-slow);border-color:var(--sev-slow)}
  .sev-crawl .chip-sev{background:var(--sev-crawl-bg);color:var(--sev-crawl);border-color:var(--sev-crawl)}

  .chip-done{background:var(--accent);color:var(--surface);border-color:var(--accent)}
  .is-done{opacity:.82}
  .is-done .ticket-bar{background:var(--accent)!important}
  .ticket-body p{margin:0 0 12px;max-width:72ch}
  .ticket-body p:last-of-type{margin-bottom:0}
  .why{color:var(--ink-soft)}
  .why b{color:var(--ink);font-weight:500}
  .accept{
    background:var(--surface-sunk);border-radius:3px;padding:12px 15px;
    font-size:.99rem;border-left:2px solid var(--accent);
  }
  .accept .lbl{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px;
  }
  code{
    font-family:"IBM Plex Mono",monospace;font-size:.855em;
    background:var(--accent-soft);padding:1px 5px;border-radius:2px;
    word-break:break-word;
  }
  .meta{
    display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;
    padding-top:13px;border-top:1px solid var(--rule);
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-faint);
  }
  .meta b{color:var(--ink-soft);font-weight:500}
  .meta a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule-strong)}
  .meta a:hover,.meta a:focus-visible{border-bottom-color:var(--accent)}

  /* ---------- tableau backlog ---------- */
  .scroller{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:1rem}
  caption{text-align:left;padding:0 0 12px;color:var(--ink-soft);font-size:.98rem}
  th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
  thead th{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-faint);font-weight:500;
    background:var(--surface-sunk);border-bottom:1px solid var(--rule-strong);
  }
  tbody tr:last-child td{border-bottom:none}
  td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.mois{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.06em;color:var(--ink-faint);white-space:nowrap}
  .virgin{
    display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);border-radius:2px;padding:2px 6px;margin-left:8px;
    white-space:nowrap;
  }

  /* ---------- questions ---------- */
  .asks{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
  .ask{
    background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--accent);
    border-radius:3px;padding:18px 20px 20px;
  }
  .ask h3{font-family:"Archivo",sans-serif;font-size:1rem;font-weight:600;margin:0 0 7px}
  .ask p{margin:0;font-size:.99rem;color:var(--ink-soft)}

  footer{
    margin-top:clamp(48px,7vw,76px);padding-top:22px;border-top:1px solid var(--rule-strong);
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-faint);
    display:flex;flex-wrap:wrap;gap:6px 24px;
  }

  @media (max-width:560px){
    article.ticket{grid-template-columns:1fr}
    .ticket-rail{
      flex-direction:row;border-right:none;border-bottom:1px solid var(--rule);
      padding:10px 18px;justify-content:flex-start;align-items:center;
    }
    .ticket-bar{width:auto;height:3px;flex:1;min-height:0}
    .ticket-body{padding:18px 18px 20px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
